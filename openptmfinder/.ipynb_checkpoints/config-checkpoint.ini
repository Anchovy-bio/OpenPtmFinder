; ============================================================================
; OpenPtmFinder configuration file
;
; The file is organized into three sections:
;   [PATHS]      - input/output locations
;   [PARAMETERS] - modification search, PSM filtering and general settings
;   [STATISTICS] - site-level statistics: calculation type, per-modification
;                  sorting, aggregation and empirical Bayes hyperparameters
;
; Command-line arguments (-o, -p, -m, -a, -d, -u, -g, -n, -pr) override the
; corresponding values defined here.
;
; NOTE: before publishing, replace the absolute paths below with your own.
; ============================================================================

[PATHS]
; --- Input files and directories -------------------------------------------

; Full path to the FASTA file with protein sequences (with decoys).
protein_db = /home/kopeykina/db_decoy.fasta

; Full path to the Unimod database XML file.
unimod_db = /home/kopeykina/search_modification_project/openptmfinder/data/unimod_tables.xml

; CSV file assigning TMT channels to experimental groups per plex (batch).
; Must contain 'file_name', 'batch' and at least TMT_group1 and TMT_group2;
; additional TMT_groupN columns define more groups (all pairwise contrasts
; are tested automatically). The 'mix_channels' column (global internal
; standard) is optional. An example can be found at
; https://github.com/Anchovy-bio/OpenPtmFinder/
grouping_file = /home/kopeykina/group_Banner.csv

; Directory with AA_stat results: CSV files of mass shifts and the
; 'interpretations.json' file (required).
aa-stat_dir = /home/data/syn7170616/Data/Proteomics/TMT/open_search/aa_stat_results/

; Directory with the mzML files.
mzml_dir = /home/data/syn7170616/Data/Proteomics/TMT/mzml/

; Directory with pepXML files from the open search (e.g. MSFragger).
pepxml_dir = /home/data/syn7170616/Data/Proteomics/TMT/open_search/

; Directory with Sage output. Either a parent directory containing one folder
; per search run (each with results.sage.tsv and tmt.tsv) or a single result
; folder. Used only when search_engine = sage.
sage_dir = /home/data/syn7170616/Data/Proteomics/TMT/sage_phospho/

; --- Output -----------------------------------------------------------------

; Directory where all output files are stored.
output_dir = /home/kopeykina/aa_stat_results_TMT/banner/results/


[PARAMETERS]
; --- Modification search ----------------------------------------------------

; Comma-separated list of Unimod classification keys (integers) selecting
; which modification classes are considered. Examples:
;   2  = Post-translational
;   7, 8, 9 = Glycosylation
;   5  = Chemical derivative
;   11 = Isotopic label
;   13 = Multiple
;   14 = Other
;   15 = AA substitution
type_of_modifications = 2, 7, 8, 9

; Comma-separated list of modification names to search for; names must match
; the 'code_name' attribute in the Unimod XML. Use 'all' to disable filtering.
name_of_modifications = all

; Comma-separated list of modification substrings to EXCLUDE from the
; statistical analysis (plain substring match, no regular expressions).
; Example: exclude_modifications = Methyl@E, Hydroxylation@M
; Leave empty to keep all modifications.
exclude_modifications = Methyl@E

; Comma-separated list of "regex_pattern=replacement" pairs applied to the
; 'Modification' column before statistics. Used to merge chemically related
; annotations into a single modification type.
; Example: modification_aliases = Phospho\+PL=Phospho, pyrophospho=Phospho
; Leave empty to disable.
modification_aliases = Phospho\+PL=Phospho, pyrophospho=Phospho

; --- PSM filtering ----------------------------------------------------------

; Minimum localization score for a modification to be considered valid
; (0..1). PSMs below the threshold are excluded from the analysis.
localization_score_threshold = 0

; Mass tolerance (Da) for matching a modification mass shift to the
; experimental mass difference in the pepXML files.
mass_tolerance = 0.01

; FDR threshold for filtering PSMs from the pepXML files.
fdr_threshold = 0.05

; Minimum number of PSMs per mass shift required to estimate its individual
; FDR; below this, the default score thresholds are used instead.
min_hits_for_fdr_calc = 20

; Default hyperscore threshold (used when individual FDR cannot be estimated).
default_hyperscore_threshold = 15

; Default expect-value threshold (used when individual FDR cannot be estimated).
default_expect_threshold = 0.05

; --- General ----------------------------------------------------------------

; TMT labeling type used in the experiment (e.g. TMT10plex, TMT11plex).
type_tmt = TMT11plex

; Input/preprocessing engine:
;   msfragger - AA_stat + pepXML + mzML open-search preprocessing (default);
;   sage      - read Sage results.sage.tsv + tmt.tsv directly. The Sage branch
;               is intended for enriched PTM data and forces
;               type_experiment = phospho enrichment (no reference PSMs).
search_engine = msfragger

; Enable/disable p-value calculation for statistical testing (True/False).
calculation_pval = True

; Additional pepXML PSM filtering based on hyperscore/expect values
; (True/False). NOTE: not supported by the current statistics pipeline
; (the WLS/limma model handles per-channel missingness directly) --
; keep False.
sorting_pepxml = False

; --- TMT normalization -------------------------------------------------------

; Normalization target:
;   auto   - recommended. Uses GIS (mix_channels) for phospho enrichment when
;            a global internal standard is present; otherwise median. Whole
;            proteome uses median channel centering, with GIS (if present)
;            for cross-batch alignment.
;   median - robust per-batch median channel centering. For phospho enrichment
;            this assumes most phosphosites are unchanged across channels.
;   gis    - align batches by the global internal standard only (enrichment
;            designs); falls back to median with a warning if GIS is absent.
norm_target = auto

; Minimum fraction of TMT channels with a non-zero reporter value required
; for a PSM to be used in normalization (zeros count as missing).
norm_min_fraction_valid = 0.5

; Use mix_channels global internal standard for cross-batch alignment when
; available (True/False).
norm_use_gis_for_batch = True

; --- Sage / enriched-PTM preprocessing --------------------------------------
; Used only when search_engine = sage. Defaults match Sage phospho-TMT output:
; results.sage.tsv contains PSMs and q-values/scores; tmt.tsv contains reporter
; intensities with columns tmt_<channel>. The branch keeps only modified PSMs
; matching sage_mod_keep_regex, maps them to protein positions in protein_db,
; and then uses the same normalization/statistics path with *_norm columns.

; File names inside each Sage result folder.
sage_results_filename = results.sage.tsv
sage_tmt_filename = tmt.tsv

; Reporter intensity prefix in tmt.tsv (Sage: tmt_; MSFragger branch: intensity_).
sage_intensity_prefix = tmt_

; FDR control for Sage PSMs:
;   spectrum_peptide_q - use spectrum_q and peptide_q columns (recommended);
;   discriminant_score - target-decoy q-values from sage_score_column.
sage_fdr_method = spectrum_peptide_q
sage_score_column = sage_discriminant_score

; Decoy pattern in the proteins column.
sage_decoy_regex = DECOY|rev_

; Modification to keep/map. Default matches phospho brackets [+79.966...].
; The regex is applied to bracket contents, e.g. +79.966331.
sage_mod_keep_regex = \+79\.

; Modification label written to the Modification column for compatibility.
sage_mod_name = Phospho

; Keep only PSMs whose peptide contains sage_mod_keep_regex (True/False).
sage_require_mod = True

; If False, map a peptide only to the first protein in the Sage proteins list;
; if True, emit all protein mappings (higher ambiguity, more rows).
sage_map_all_proteins = False

; Number of parallel processes. Overridden by the -n/--nproc argument.
nproc = 3

; Port for the web server (used only with the --run_server flag).
port = 10005

; --- Database site annotation (before statistics) ---------------------------

; Annotate unique modification sites against the iPTMnet database and the
; protein FASTA BEFORE the statistical analysis (True/False; whole-proteome
; branch only). Adds per-site columns: in_iPTM (exact database match),
; perhapse_in_iPTM / perhapse_position / perhapse_ptm_type (nearest database
; site of the same modification class within iptmnet_window), and
; rescued_position / rescued_ptm_type (sequence-based relocalization).
; The annotation table is cached as <output_dir>/iptmnet_positions.csv and
; reused on subsequent runs (force re-fetch with --recalc_results).
db_annotation = True

; Apply the rescued positions (True/False). True: rescued_position and
; rescued_ptm_type REPLACE the original position_in_protein and Modification
; columns used by the statistics (the pre-annotation keys are kept in the
; iptmnet_positions.csv cache file). False: keep the original positions;
; annotation columns are informative only.
iptmnet_rescue = False

; Window (amino acids, +/-) around the reported site used both for the
; nearest iPTMnet match and for the sequence-based relocalization to the
; nearest residue compatible with the modification type (e.g. S/T/Y for
; phosphorylation).
iptmnet_window = 7

; --- dbPTM site annotation (optional, before statistics) --------------------

; Additionally annotate unique modification sites against the dbPTM database
; (True/False; whole-proteome branch only). Instead of downloading the full
; dbPTM dump, the experimental PTM-site table is fetched per protein from the
; protein pages (info.php?id=<UniProt entry name>); UniProt accessions are
; resolved to dbPTM entry names from the FASTA headers or, as a fallback, via
; the dbPTM search-by-accession endpoint. Adds per-site columns: in_dbPTM
; (exact match of the same modification class), dbptm_ptm_types / dbptm_pmids
; (all dbPTM records at the exact position), and perhapse_in_dbPTM /
; perhapse_position_dbptm / perhapse_ptm_type_dbptm (nearest dbPTM site of
; the same class within dbptm_window). The annotation is informative only —
; original and rescued positions are not changed. Cached as
; <output_dir>/dbptm_positions.csv (force re-fetch with --recalc_results).
dbptm_annotation = False

; Window (amino acids, +/-) for the nearest same-class dbPTM match.
; Default: the value of iptmnet_window.
dbptm_window = 7

; --- SIGNOR causal-network annotation (optional, after statistics) -----------

; Annotate unique modification sites with the SIGNOR causal signaling network
; (https://signor.uniroma2.it/; True/False; whole-proteome branch only).
; SIGNOR curates causal relations with the underlying mechanism, i.e. what a
; PTM at a given residue DOES to the protein: regulator --[phosphorylation
; @Ser15]--> target with effect up-/down-regulates, PMID, direct/indirect
; flag and a curator score. Interactions are fetched per protein via the
; documented API (getData.php?id=<UniProtAC>) — no full-database download.
; Runs AFTER the statistics and does not affect testing. Adds per-site
; columns: in_SIGNOR (residue-exact causal PTM record of the same
; modification class), signor_evidence ('site' residue-exact / 'protein'
; mechanism-level), signor_effect_on_protein (activate / inhibit /
; conflicting / unknown), signor_regulations ('PLK1
; phosphorylation->down-regulates; ...'), signor_regulators and
; signor_pmids. Cached as <output_dir>/signor_sites.csv +
; <output_dir>/signor_edges.csv (force re-fetch with --recalc_results).
signor_annotation = False

; Organism (NCBI tax id) for the SIGNOR queries: 9606 human, 10090 mouse,
; 10116 rat.
signor_organism = 9606

; Build signor_network.html (True/False): an interpretation-oriented network
; of the measured modified proteins (colored by their experimental
; regulation, sized by the number of PTM sites) and their upstream SIGNOR
; regulators. Edges are the causal PTM interactions colored by effect
; (green = activation, red = inhibition, grey = unknown; solid = direct,
; dashed = indirect) with the mechanism and residue as the label; the page
; carries an HTML legend, effect/direct/context edge filters and a
; protein-focus selector. Fully self-contained (works offline).
signor_network = True

; Parallel SIGNOR fetch workers.
signor_max_workers = 6

; --- HTML report and interactive mode ----------------------------------------

; Generate a self-contained interactive HTML report at the end of the run
; (True/False). The report (<output_dir>/openptmfinder_report.html) embeds
; plotly.js and all table/volcano logic — no server or internet connection
; needed; it can be archived together with the results. It contains: summary
; cards, PTM landscape, a volcano plot with client-side threshold controls,
; a heatmap of top differential sites, per-protein modification landscapes
; for the top significant proteins, a searchable/sortable/exportable results
; table and a QC section. Disable for a single run with --no_report.
html_report = True

; 'inline' embeds plotly.js into the report (fully offline, larger file);
; 'cdn' links plotly.js from a CDN (compact, needs internet to open).
report_plotlyjs = inline

; Number of top significant proteins shown in the protein landscape section
; (arbitrary proteins can be queried in the interactive mode).
report_top_proteins = 10

; Default thresholds for the significance counters / volcano controls.
report_alpha = 0.05
report_logfc = 1.0

; Start the interactive Dash web app after processing (True/False; CLI:
; --interactive). Same pages as the report plus arbitrary-protein queries
; on the fly, with real server-side callbacks (waitress production server
; when installed). Requires: pip install dash pyarrow (waitress recommended).
; Both the app and the report read the parquet data layer written to
; <output_dir>/report_data/ at the end of the run.
interactive = False


[STATISTICS]
; --- Calculation type ---------------------------------------------------------

; Site-abundance calculation mode:
;   aggregate - PSMs are aggregated to modification sites
;               (Modification_protein_position);
;   median    - peptide-level analysis (protein_peptide).
; Both modes require a site to be observed in at least 'min_batches' plexes
; (see below).
calculating_method = aggregate

; Experiment layout:
;   whole proteome     - modified sites are corrected for protein abundance
;                        estimated from unmodified (reference) PSMs;
;   phospho enrichment - no protein-abundance correction (no references).
; NOTE: when search_engine = sage, the enriched-PTM branch forces
;       phospho enrichment because Sage preprocessing has no reference PSMs.
type_experiment = whole proteome

; Minimum number of observations required per experimental group of a
; contrast (per TMT_groupN), and minimum PSM count per site for the site
; to enter the analysis.
min_group_for_stats = 5

; Minimum number of TMT plexes (batches) in which a site must be observed
; to enter the statistical analysis. Applies to both calculating_method
; modes ('aggregate' and 'median'); previously hard-coded in the core code
; (1 for aggregate, 3 for median).
min_batches = 1

; --- Per-modification sorting (EB vs common pool) ---------------------------
;
; A modification is tested in its OWN family with empirical Bayes (EB)
; variance moderation only if ALL of the following hold:
;   - number of unique sites            >= min_sites_mod
;   - number of reference (unmodified) PSM rows >= min_ref
;   - median non-missing channel observations per site >= min_obs_per_site
; Otherwise the modification is moved to the COMMON POOL, where all rare
; modifications are tested together WITHOUT EB moderation (ordinary
; weighted t-statistics per site; BH correction within the pool).
; Rationale: the EB prior (d0, s0^2) is unreliable on a handful of sites,
; and pooling different modification types into one prior would mix their
; distinct variance distributions.

; Minimum number of unique sites for a modification-specific EB analysis.
min_sites_mod = 100

; Minimum number of reference PSM rows for a modification-specific analysis.
min_ref = 100

; Minimum median number of observed channels per PSM row within a site.
min_obs_per_site = 3

; OPTIONAL stoichiometry criterion: minimum median number of channels where
; BOTH the modified and the reference rows of the same site are observed.
; Meaningful only if reference rows share (protein, position) keys with
; modified rows; otherwise keep 0 (criterion disabled).
min_pairs_for_stoich = 0

; Minimum number of unique sites in the common pool for the pooled
; statistical testing to run at all.
min_sites_for_common = 20

; Minimum number of successfully fitted sites required to ENABLE EB
; moderation within a modification family; below this, ordinary
; t-statistics are used even for sufficiently represented modifications.
min_sites_eb = 30

; --- PSM aggregation hyperparameters ----------------------------------------

; Intra-cluster correlation mode for the effective PSM count
; n_eff = n / (1 + (n-1)*rho):
;   estimate - rho (ICC) is estimated from the data per site (recommended);
;   fixed    - rho = fixed_icc for all sites;
;   sqrt     - legacy mode, n_eff = sqrt(n).
icc_mode = estimate

; ICC value used when icc_mode = fixed.
fixed_icc = 0.30

; Tuning constant of the Huber loss used in the robust aggregation
; (in units of the MAD of group means). Smaller values = more aggressive
; down-weighting of outlying peptide groups.
huber_c = 1.345

; Number of Huber IRLS iterations.
huber_iters = 3

; Per-channel variance floor, as a percentile of the shrunk variances
; within a site (prevents infinite precision for near-constant channels).
var_floor_pct = 10.0

; --- Empirical Bayes moderation (limma-style) --------------------------------

; Lower and upper bounds for the prior degrees of freedom d0 estimated by
; the trigamma method of moments. Widening the range allows stronger/weaker
; variance shrinkage when the data support it.
eb_d0_floor = 2.0
eb_d0_ceil = 200.0

; --- Permutation validation (optional) --------------------------------------
;
; Batch-stratified label-permutation test used to demonstrate the calibration
; of the statistical procedure (Type I error / FDR control), e.g. for a
; publication. For every contrast the number of significant hits in the
; observed data is compared against the null distribution obtained by
; permuting group labels WITHIN each TMT batch and re-running the SAME
; testing procedure (WLS + EB moderation + BH). Results are written to
; permutation_<method>_<modification>.csv and include the permutation
; p-value, an empirical FDR estimate (mean null hits / observed hits) and
; the full null distribution (perm_counts column) for plotting.
; Computationally expensive -- disabled by default.

; Enable/disable the permutation validation (True/False).
run_permutation = False

; Number of random labelings when exact enumeration is not feasible.
n_perm = 1000

; Significance thresholds defining a "hit" in both observed and permuted
; data (adjusted p-value and absolute logFC).
perm_alpha = 0.05
perm_logfc_thresh = 1.0

; If the total number of distinct labelings (product over batches of the
; binomial coefficients C(n_batch, n_group1_batch)) does not exceed this
; value, ALL labelings are enumerated exactly, i.e. the permutation p-value
; has no Monte-Carlo error. Set to 0 to force random permutations.
perm_exact_threshold = 5000

; Random seed for reproducibility (used only in random mode).
perm_seed = 42
